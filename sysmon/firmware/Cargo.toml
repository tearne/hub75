[package]
name = "sysmon-firmware"
version = "0.1.0"
edition = "2021"
description = "Firmware for the panel that sysmon drives. Bakes 'sysmon' USB serial-number identity."

[features]
default = ["usb-serial-firmware-lib/panel-shift-64x32"]

[dependencies]
usb-serial-firmware-lib = { path = "../../usb-serial/firmware-lib" }
hub75 = { path = "../../hub75" }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-rp = { version = "0.10", features = ["rp235xa", "defmt", "time-driver", "critical-section-impl", "unstable-pac"] }
embassy-usb = { version = "0.6", features = ["defmt"] }
embassy-futures = "0.1"
static_cell = "2"
cortex-m = "0.7"
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

[profile.release]
opt-level = "s"
debug = true
lto = true
