[package]
name = "usb-serial-firmware"
version = "0.7.0"
edition = "2021"

[features]
panel-shift-64x64 = ["hub75/panel-shift-64x64"]
panel-shift-64x32 = ["hub75/panel-shift-64x32"]
panel-spwm-128x64 = ["hub75/panel-spwm-128x64"]

[dependencies]
hub75 = { path = "../../hub75" }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5" }
embassy-rp = { version = "0.10", features = ["rp235xa", "defmt", "time-driver", "critical-section-impl", "unstable-pac"] }
embassy-sync = "0.8"
embassy-usb = { version = "0.6", features = ["defmt"] }
embassy-futures = "0.1"
static_cell = "2"
cortex-m = "0.7"
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

[profile.release]
opt-level = "s"
debug = true
lto = true
