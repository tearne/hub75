[package]
name = "usb-serial-firmware-lib"
version = "0.1.0"
edition = "2021"
description = "Shared firmware logic for USB-to-HUB75 panels: USB descriptor setup, frame protocol, button polling."

[features]
panel-shift-64x64 = ["hub75/panel-shift-64x64"]
panel-shift-64x32 = ["hub75/panel-shift-64x32"]
panel-spwm-128x64 = ["hub75/panel-spwm-128x64"]

[dependencies]
hub75 = { path = "../../hub75" }
embassy-rp = { version = "0.10", features = ["rp235xa", "defmt", "time-driver", "critical-section-impl", "unstable-pac"] }
embassy-sync = "0.8"
embassy-time = { version = "0.5" }
embassy-usb = { version = "0.6", features = ["defmt"] }
embassy-futures = "0.1"
static_cell = "2"
defmt = "0.3"
